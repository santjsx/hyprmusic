<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="100%" height="100%">
  <defs>
    <linearGradient id="it2-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FF003C" />
    </linearGradient>
    <radialGradient id="it2-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Icon: OLED Cyberpunk Wayland Pulse Dock -->
  <g id="icon" transform="translate(60, 60)">
    <circle cx="196" cy="196" r="190" fill="url(#it2-glow)" />
    <circle cx="196" cy="196" r="176" fill="#0A0A0F" stroke="#00F0FF" stroke-width="2.5" stroke-opacity="0.5" />
    <circle cx="196" cy="196" r="162" fill="none" stroke="#FF003C" stroke-width="1.5" stroke-dasharray="3 8" stroke-opacity="0.6" />

    <!-- 4 Workspace Quadrant Ring Segments (High-Contrast Neon) -->
    <path d="M 203 44 A 152 152 0 0 1 348 189 L 306 189 A 110 110 0 0 0 203 86 Z" fill="url(#it2-cyber)" />
    <path d="M 348 203 A 152 152 0 0 1 203 348 L 203 306 A 110 110 0 0 0 306 203 Z" fill="#00F0FF" />
    <path d="M 189 348 A 152 152 0 0 1 44 203 L 86 203 A 110 110 0 0 0 189 306 Z" fill="#14141E" stroke="#FF003C" stroke-width="2.5" />
    <path d="M 44 189 A 152 152 0 0 1 189 44 L 189 86 A 110 110 0 0 0 86 189 Z" fill="#FF003C" />

    <!-- Center Transducer Core -->
    <circle cx="196" cy="196" r="74" fill="#050508" stroke="#00F0FF" stroke-width="3.5" />
    <polygon points="186,168 224,196 186,224" fill="#00F0FF" />
  </g>

  <!-- Wordmark: Typographic Section -->
  <g id="wordmark" transform="translate(480, 166)">
    <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="900" letter-spacing="-1">
      <tspan fill="#00F0FF">hypr</tspan><tspan fill="#FF003C">.</tspan><tspan fill="#FFFFFF">music</tspan>
    </text>

    <!-- Subtitle / Cyber Tagline -->
    <g id="tagline" transform="translate(6, 150)">
      <rect x="0" y="-26" width="154" height="32" rx="6" fill="#00F0FF" />
      <text x="14" y="-5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12" font-weight="900" fill="#050508" letter-spacing="2">
        CYBERPUNK
      </text>

      <text x="172" y="-5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#00F0FF" letter-spacing="3">
        OLED HIGH-VOLTAGE
      </text>
    </g>
  </g>
</svg>
