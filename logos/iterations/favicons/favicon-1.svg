    <radialGradient id="fav1-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7AA2F7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#11111B" stop-opacity="0" />
