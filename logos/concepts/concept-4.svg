<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="100%" height="100%">
  <defs>
    <linearGradient id="c4-stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AA2F7" />
      <stop offset="60%" stop-color="#89B4FA" />
      <stop offset="100%" stop-color="#CBA6F7" />
    </linearGradient>
  </defs>

  <!-- Icon: Lucide-Style Minimal Continuous Waveform Frame -->
  <g id="icon" transform="translate(64, 64)">
    <!-- Sleek Rounded Backplate -->
    <rect x="20" y="20" width="344" height="344" rx="84" fill="#181825" stroke="#313244" stroke-width="3" />

    <!-- 5-Band Vertical EQ Track Slots (Subtle Background Grid) -->
    <line x1="110" y1="110" x2="110" y2="274" stroke="#313244" stroke-width="8" stroke-linecap="round" />
    <line x1="152" y1="90" x2="152" y2="294" stroke="#313244" stroke-width="8" stroke-linecap="round" />
    <line x1="192" y1="70" x2="192" y2="314" stroke="#313244" stroke-width="8" stroke-linecap="round" />
    <line x1="232" y1="90" x2="232" y2="294" stroke="#313244" stroke-width="8" stroke-linecap="round" />
    <line x1="274" y1="110" x2="274" y2="274" stroke="#313244" stroke-width="8" stroke-linecap="round" />

    <!-- Active Spline Curve (Dynamic Cubic EQ Spline) -->
    <path d="M 80 230 C 120 230, 130 130, 160 130 C 180 130, 185 270, 205 270 C 225 270, 240 100, 270 100 C 295 100, 305 210, 330 210" 
          stroke="url(#c4-stroke-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Spline Nodes (Active Parametric Nodes) -->
    <circle cx="160" cy="130" r="14" fill="#7AA2F7" stroke="#181825" stroke-width="5" />
    <circle cx="205" cy="270" r="14" fill="#89B4FA" stroke="#181825" stroke-width="5" />
    <circle cx="270" cy="100" r="14" fill="#CBA6F7" stroke="#181825" stroke-width="5" />
  </g>

  <!-- Wordmark: Premium Contemporary Typographic Section -->
  <g id="wordmark" transform="translate(480, 160)">
    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="2">
      <tspan fill="#CDD6F4">HYPR</tspan> <tspan fill="#7AA2F7">MUSIC</tspan>
    </text>

    <!-- Subtitle / DSP Telemetry Bar -->
    <g id="tagline" transform="translate(4, 150)">
      <rect x="0" y="-26" width="180" height="32" rx="8" fill="#CBA6F7" fill-opacity="0.15" stroke="#CBA6F7" stroke-width="1.5" />
      <text x="14" y="-5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#CBA6F7" letter-spacing="2">
        DSP COMPOSITOR
      </text>

      <text x="204" y="-5" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="14" font-weight="500" fill="#89B4FA" letter-spacing="2">
        PARAMETRIC EQUALIZER
      </text>
    </g>
  </g>
</svg>
